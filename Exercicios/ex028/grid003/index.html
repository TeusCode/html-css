<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinamento Grid</title>
    <style>
        .container {
            background-color: rgb(177, 53, 177);
            height: 800px;
            width: 800px;
            display: grid;

            grid-template-columns: auto auto;

            justify-items: space-evenly;
            gap: 5px;
        }

        .itens {
            border: 2px solid red;
            background-color: red;
            width: 100px;
            height: 100px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="itens">A</div>
        <div class="itens">B</div>
        <div class="itens">C</div>
        <div class="itens">D</div>
        <div class="itens">E</div>
        <div class="itens">F</div>
        <div class="itens">G</div>
        <div class="itens">H</div>
        <div class="itens">I</div>
    </div>

</body>

</html>
