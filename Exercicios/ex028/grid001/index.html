<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinamento Grid</title>
    <style>
        .container {
            border: 2px solid green;
            display: grid;
            width: 500px;

            grid-template-columns: 150px 150px 150px;
            grid-template-rows: 150px 150px 150px;

            justify-items: center;
            align-items: center;

            justify-content: center;
            align-content: center;

            gap: 10px;
            height: 500px;
        }

        .itens {
            border: 2px solid red;
            width: 100px;
            height: 100px;
            background-color: red;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="itens">A</div>
        <div class="itens">B</div>
        <div class="itens">C</div>
        <div class="itens">D</div>
        <div class="itens">E</div>
        <div class="itens">F</div>
        <div class="itens">G</div>
        <div class="itens">H</div>
        <div class="itens">I</div>
    </div>

</body>

</html>
