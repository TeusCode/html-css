<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão de Grid</title>

    <style>
        #container {
            background-color: gray;
            padding: 10px;
            width: 300px;
            margin: auto;
            border-radius: 10px;

            display: grid;
            grid-template-columns: auto;
            grid-template-rows: 50px 50px 50px 50px 50px 50px 50px;
        }

        .item {
            padding: 5px;
            background-color: white;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .item:hover {
            background-color: rgb(236, 236, 236);
            color: rgb(255, 0, 0);
        }

        #container2 {
            margin-top: 20px;
            background-color: rgb(0, 174, 255);
            width: 70%;
            padding: 10px;
            margin-left: auto;
            margin-right: auto;
            border-radius: 10px;
            box-shadow: 5px 1px 10px rgba(0, 0, 0, 0.438);

            display: flex;
            justify-content: center;
            flex-flow: row wrap;
        }

        .item2 {
            background-color: gray;
            padding: 5px;
            border-radius: 5px;
            margin: 5px 5px 0px 5px;
            text-align: center;
            color: white;
            font-size: 1.2em;
            font-family: Arial, Helvetica, sans-serif;
            box-shadow: 5px 1px 10px rgba(0, 0, 0, 0.438);

            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1 1 100px;
        }

        .item2:hover {
            background-color: white;
            color: blue;
        }
    </style>
</head>

<body>
    <main id='container'>
        <div class="item">Home</div>
        <div class="item">Informações</div>
        <div class="item">Contato</div>
        <div class="item">Shop</div>
        <div class="item">Vips</div>
        <div class="item">Sorteios</div>
        <div class="item">Localização</div>
    </main>

    <section id="container2">
        <div class="item2">Home fwef e</div>
        <div class="item2">Principal</div>
        <div class="item2">Contato</div>
        <div class="item2">Localização</div>
        <div class="item2">Autores</div>
    </section>
</body>

</html>
