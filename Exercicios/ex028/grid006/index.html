<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinando Grid</title>
    <style>
        .containerH {
            background-color: gray;

            display: grid;
            grid-template: repeat(5, 100px)/repeat(9, 1fr)
        }

        .item1H {
            background-color: red;

            /*Substitui o grid-row-start e grid-row-end*/
            grid-row: 1/ span 1;
            /*Substitui o grid-column-start e grid-column-end*/
            grid-column: 1/ span 4;
        }

        .item2H {
            background-color: green;

            grid-row: 1/ span 1;
            grid-column: 5/ span 2;
        }

        .item3H {
            background-color: blue;

            grid-row: 1/2;
            grid-column: 7/-1;
        }

        .item4H {
            background-color: yellow;

            grid-row: 2/-1;
            grid-column: 1/5;
        }

        .item5H {
            background-color: purple;

            grid-row: 2/-1;
            grid-column: 5/-1;
        }

        .item6H {
            background-color: aqua;

            grid-row: 3/5;
            grid-column: 6/9;
        }
    </style>
</head>

<body>
    <div class="containerH">
        <div class="item1H">Caixa1</div>
        <div class="item2H">Caixa2</div>
        <div class="item3H">Caixa3</div>
        <div class="item4H">Caixa4</div>
        <div class="item5H">Caixa5</div>
        <div class="item6H">Caixa6</div>
    </div>
</body>

</html>
