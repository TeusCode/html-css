<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            display: flex;
            background-color: lightcoral;
            flex-direction: row;
            flex-wrap: wrap-reverse;
        }

        div.item {
            border: 1px solid rgb(0, 0, 0);
            background-color: blueviolet;
            padding: 10px;
            text-align: center;
            color: white;
        }
    </style>
</head>

<body>
    <div class="conteiner">
        <div class="item">EXEMPLO A</div>
        <div class="item">EXEMPLO B</div>
        <div class="item">EXEMPLO C</div>
        <div class="item">EXEMPLO D</div>
        <div class="item">EXEMPLO E</div>
        <div class="item">EXEMPLO F</div>
        <div class="item">EXEMPLO G</div>
        <div class="item">EXEMPLO H</div>
        <div class="item">EXEMPLO I</div>

    </div>
</body>

</html>
