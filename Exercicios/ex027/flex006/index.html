<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicios Justify e align</title>
    <style>
        body {
            background-color: purple;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            background-color: white;
            border: 2px solid #333;
            border-radius: 10px;
            height: 500px;

            flex-direction: row;
            flex-wrap: wrap;
            align-content: flex-start;
            /* Adicione as propriedades pedidas abaixo */
        }

        .item {
            background-color: dodgerblue;
            color: white;
            padding: 20px;
            margin: 5px;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item">TESTE TESTE</div>
        <div class="item">TESTE TESTE</div>
        <div class="item">TESTE TESTE</div>
    </div>
</body>

</html>
