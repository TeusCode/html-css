<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 015 - Grid Layout</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
            color: blue;
        }

        .container {
            width: 100vw;
            height: 100vh;
            margin: auto;

            display: grid;
            grid-template-columns: 3fr 300px;
            grid-template-rows: 150px 100px 4fr 100px;
            gap: 11px;
        }

        #topo {
            background-color: yellow;

            display: flex;
            align-items: center;
            justify-content: center;

            grid-row: 1/2;
            grid-column: 1/-1;
        }

        #menu {
            background-color: yellow;

            display: flex;
            align-items: center;
            justify-content: center;

            grid-row: 2/3;
            grid-column: 1/-1;

        }

        #principal {
            background-color: yellow;

            display: flex;
            align-items: center;
            justify-content: center;

            grid-row: 3/4;
            grid-column: 1/2;

        }

        #secundario {
            background-color: yellow;

            display: flex;
            align-items: center;
            justify-content: center;

            grid-row: 3/4;
            grid-column: 2/-1;
        }

        #rodape {
            background-color: yellow;

            display: flex;
            align-items: center;
            justify-content: center;

            grid-row: 4/-1;
            grid-column: 1/-1;
        }
    </style>

</head>

<body>
    <div class="container">
        <header id="topo">
            TOPO
        </header>
        <nav id="menu">
            MENU
        </nav>
        <main id="principal">
            PRINCIPAL
        </main>
        <aside id="secundario">
            SECUNDARIO
        </aside>
        <footer id="rodape">
            RODAPE
        </footer>
    </div>
</body>

</html>
